<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ChatConnect{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0f0f0f;
            --surface: #1a1a2e;
            --surface2: #16213e;
            --primary: #4361ee;
            --primary-hover: #3a56d4;
            --accent: #7209b7;
            --success: #06d6a0;
            --danger: #ef476f;
            --warning: #ffd166;
            --text: #e8e8e8;
            --text-muted: #8b8b8b;
            --border: #2a2a3e;
            --radius: 10px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        a { color: var(--primary); text-decoration: none; }
        a:hover { text-decoration: underline; }

        /* -- Navbar -- */
        .navbar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .navbar-brand {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
        }
        .navbar-links { display: flex; gap: 16px; align-items: center; }
        .navbar-links a { color: var(--text-muted); font-size: 0.9rem; }
        .navbar-links a:hover { color: var(--text); text-decoration: none; }
        .navbar-links a.active { color: var(--primary); }

        /* -- Buttons -- */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 18px;
            font-size: 0.9rem;
            font-weight: 500;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            color: #fff;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: var(--primary); }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-success { background: var(--success); color: #000; }
        .btn-danger { background: var(--danger); }
        .btn-sm { padding: 5px 12px; font-size: 0.8rem; }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }
        .btn-outline:hover { border-color: var(--primary); color: var(--primary); }

        /* -- Forms -- */
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        .form-control {
            width: 100%;
            padding: 10px 14px;
            font-size: 0.95rem;
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            outline: none;
            transition: border-color 0.2s;
        }
        .form-control:focus { border-color: var(--primary); }

        /* -- Cards -- */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
        }

        /* -- Layout helpers -- */
        .container { max-width: 1100px; margin: 0 auto; padding: 24px; }
        .grid-2 { display: grid; grid-template-columns: 300px 1fr; gap: 20px; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .gap-8 { gap: 8px; }
        .gap-12 { gap: 12px; }
        .mt-12 { margin-top: 12px; }
        .mt-20 { margin-top: 20px; }
        .text-center { text-align: center; }
        .text-muted { color: var(--text-muted); }
        .text-sm { font-size: 0.85rem; }

        /* -- Status badge -- */
        .badge {
            display: inline-block;
            padding: 2px 8px;
            font-size: 0.75rem;
            border-radius: 12px;
            font-weight: 600;
        }
        .badge-online { background: var(--success); color: #000; }
        .badge-offline { background: var(--border); color: var(--text-muted); }

        /* -- Alert -- */
        .alert {
            padding: 12px 16px;
            border-radius: var(--radius);
            margin-bottom: 16px;
            font-size: 0.9rem;
        }
        .alert-error { background: rgba(239, 71, 111, 0.15); border: 1px solid var(--danger); color: var(--danger); }
        .alert-success { background: rgba(6, 214, 160, 0.15); border: 1px solid var(--success); color: var(--success); }
        .alert-info { background: rgba(67, 97, 238, 0.15); border: 1px solid var(--primary); color: var(--primary); }

        /* -- Auth page center -- */
        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .auth-card {
            width: 380px;
            max-width: 100%;
        }

        /* -- Base mobile adjustments -- */
        @media (max-width: 480px) {
            .auth-card { width: 100%; }
            .card { padding: 16px; }
            .btn { padding: 10px 16px; }
            .form-control { padding: 12px 14px; }
        }

        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
    {% block body %}{% endblock %}

    {% block scripts %}{% endblock %}
</body>
</html>
